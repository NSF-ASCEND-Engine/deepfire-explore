name: site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    # GitHub Pages is not offered for private repos on the org's free plan. Once Pages is
    # available (Settings -> Pages -> Source: GitHub Actions), set the repository variable
    # DEPLOY_PAGES=true to turn this job on. Until then the rendered site is the
    # `github-pages` artifact on each run.
    if: vars.DEPLOY_PAGES == 'true'
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
